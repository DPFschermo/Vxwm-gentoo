[bar/mybar]
width = 98%
height = 27pt
offset-x = 1%
offset-y = 1%
radius = 12
background = #aa282A36
foreground = #F8F8F2
font-0 = "JetBrains Mono:size=11;2"
font-1 = "Symbols Nerd Font:size=11;2"
override-redirect = false
wm-restack = bspwm
bottom = false
modules-left = xworkspaces
modules-center = xwindow
modules-right = pulseaudio date
monitor = HDMI-1

line-size = 3pt
border-size = 4pt
border-color = #00000000
padding-left = 1
padding-right = 1

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = #44475a
label-active-underline= #bd93f9
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = #6272a4
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
