[bar/mybar]
width = 98%
height = 27pt
offset-x = 1%
offset-y = 1%
radius = 12
background = #aa282A36
foreground = #F8F8F2
font-0 = "Comic Mono:style=Bold:size=11;3"
font-1 = "Symbols Nerd Font:size=11;2"
override-redirect = false
wm-restack = generic
bottom = true
modules-left = xworkspaces
modules-center = xwindow
modules-right = cpu memory pulseaudio wlan eth battery date powermenu
module-margin-left = 1
module-margin-right = 1
monitor = eDP-1
line-size = 3pt
border-size = 4pt
border-color = #00000000
padding-left = 1
padding-right = 1

[module/cpu]
type = internal/cpu
interval = 0.5
format = <label>
label =  %percentage%%

[module/memory]
type = internal/memory
interval = 3
format = <label>
label =  %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
format-muted = <label-muted>
label-muted = 󰝟 Muted
label-muted-foreground = #666
click-right = pavucontrol

[module/eth]
type = internal/network
interface = enp0s20f0u2u1
format-connected = <label-connected>
format-connected-prefix = "󰈀 "
label-connected = %local_ip%
click-left = /usr/bin/alacritty -e nmtui

[module/wlan]
type = internal/network
interface = wlp0s20f0u6
interval = 3.0
click-left = alacritty -e nmtui
format-connected = <label-connected>
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = #ffffff
label-connected = %essid% %downspeed%

format-disconnected = ""
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = #ff5555
label-disconnected = Disconnected

[module/battery]
type = internal/battery
full-at = 99
low-at = 30

battery = BAT0
adapter = AC0

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>

label-charging = %percentage%%
label-discharging = %percentage%%

ramp-capacity-0 = "󰁺"
ramp-capacity-1 = "󰁼"
ramp-capacity-2 = "󰁾"
ramp-capacity-3 = "󰂀"
ramp-capacity-4 = "󰁹"

animation-charging-0 = "󰂄"

[module/powermenu]
type = custom/text
content = " "
content-foreground = #ffffff
click-left = ~/.config/polybar/scripts/powermenu.sh
[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = #44475a
label-active-underline= #ffffff
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = #6272a4
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
